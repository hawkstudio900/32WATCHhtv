<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HawkTV</title>

<style>
body{
    margin:0;
    background:#000;
    color:#ff2a2a;
    font-family:Arial, sans-serif;
    overflow-x:hidden;
}

/* 🌌 ANIMATED BACKGROUND */
body::before{
    content:"";
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:
        radial-gradient(circle at 20% 20%, rgba(255,0,0,0.08), transparent 40%),
        radial-gradient(circle at 80% 60%, rgba(255,0,0,0.06), transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(255,0,0,0.05), transparent 50%);
    animation: bgMove 10s infinite alternate ease-in-out;
    z-index:-1;
}

@keyframes bgMove {
    from { transform: scale(1) translateY(0px); }
    to { transform: scale(1.1) translateY(-10px); }
}

.page{
    max-width:1000px;
    margin:0 auto;
    padding:10px 12px 25px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid #330000;
}

/* ✨ GLOWING TITLE */
.title{
    font-size:20px;
    font-weight:bold;
    color:#ff2a2a;
    text-shadow:
        0 0 5px #ff0000,
        0 0 10px #ff0000,
        0 0 20px #aa0000,
        0 0 30px #550000;
    animation: glowPulse 2.5s infinite ease-in-out;
}

@keyframes glowPulse {
    0%, 100% {
        text-shadow:
            0 0 5px #ff0000,
            0 0 10px #ff0000,
            0 0 20px #aa0000;
    }
    50% {
        text-shadow:
            0 0 10px #ff4444,
            0 0 20px #ff0000,
            0 0 35px #ff0000;
    }
}

#search{
    width:200px;
    padding:6px;
    background:#000;
    color:#ff2a2a;
    border:1px solid #aa0000;
}

#playerBox{
    width:100%;
    height:420px;
    margin-top:12px;
    border:2px solid #aa0000;
    border-radius:6px;
    overflow:hidden;
    background:black;
}

iframe{
    width:100%;
    height:100%;
    border:0;
}

/* CATEGORY BAR */
.categories{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

.cat{
    padding:6px 10px;
    border:1px solid #aa0000;
    cursor:pointer;
    font-size:12px;
    background:#111;
}

.cat:hover{
    background:#220000;
}

/* GRID */
.grid{
    margin-top:15px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
    gap:12px;
}

.card{
    background:#111;
    border:1px solid #220000;
    border-radius:6px;
    overflow:hidden;
    cursor:pointer;
    transition:0.2s;
}

.card:hover{
    transform:scale(1.05);
    border-color:#ff2a2a;
}

.thumb{
    width:100%;
    height:120px;
    object-fit:cover;
}

.info{
    padding:8px;
}

.titleText{
    font-size:13px;
    font-weight:bold;
}

.desc{
    font-size:11px;
    color:#cc6666;
}
</style>
</head>

<body>

<div class="page">

<div class="header">
    <div class="title">HawkTV</div>
    <input id="search" placeholder="search...">
</div>

<div id="playerBox">Select a video</div>

<div class="categories">
    <div class="cat" data-cat="all">All</div>
    <div class="cat" data-cat="Documentary">Documentary</div>
    <div class="cat" data-cat="Educational">Educational</div>
    <div class="cat" data-cat="Movies and Films">Movies and Films</div>
    <div class="cat" data-cat="Gaming">Gaming</div>
    <div class="cat" data-cat="Challenge">Challenge</div>
    <div class="cat" data-cat="Minecraft">Minecraft</div>
    <div class="cat" data-cat="News">News</div>
    <div class="cat" data-cat="Cartoon">Cartoon</div>
    <div class="cat" data-cat="Mumin(1969)">Mumin(1969)</div>
    <div class="cat" data-cat="Anime">Anime</div>
    <div class="cat" data-cat="EscapeToTheCountry(S25)">EscapeToTheCountry(S25)</div>
    <div class="cat" data-cat="MrBeast">MrBeast</div>
    <div class="cat" data-cat="MattBatista">MattBatista</div>
    <div class="cat" data-cat="Sitcom">Sitcom</div>
    <div class="cat" data-cat="JarToon">JarToon</div>
    <div class="cat" data-cat="Simpsons">Simpsons</div>
    <div class="cat" data-cat="Music">Music</div>
    <div class="cat" data-cat="SickickMusic">SickickMusic</div>
</div>

<div class="grid" id="grid"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const playerBox = document.getElementById("playerBox");
const grid = document.getElementById("grid");
const search = document.getElementById("search");

let currentCategory = "all";

/* ================= VIDEOS (UNCHANGED) ================= */

const videos = [
{
    title:"The best of Simpsons season 11",
    desc:"The funniest moments in the Simpsons",
    id:"lm5WwjCAsk4",
    cat:["Cartoon","Movies and Films","Sitcom","Simpsons"]
},
{
    title:"Simpsons - Talkin' Softball",
    desc:"Simpsons ending theme",
    id:"IAJHDiO8Fr0",
    cat:["Cartoon","Movies and Films","Sitcom","Simpsons"]
},
{ 
    title:"Mumin1969:The Secret of the Silk Hat",
    desc:"S1E1",
    id:"R3l77LjCkOc",
    cat:["Cartoon","Mumin(1969)","Movies and Films","Anime"]
},
{
    title:"Mumin1969:Aim for the Devil's Heart",
    desc:"S1E2 - 悪魔のハートをねらえ",
    id:"MXGIj8lalJY",
    cat:["Cartoon","Mumin(1969)","Movies and Films","Anime"]
}
];

/* ================= FUNCTIONS ================= */

function ytEmbed(id){
    return `https://www.youtube-nocookie.com/embed/${id}`;
}

function ytThumb(id){
    return `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
}

function play(video){
    playerBox.innerHTML = `
        <iframe src="${ytEmbed(video.id)}"
        allowfullscreen></iframe>
    `;
}

function render(list){
    grid.innerHTML = "";

    list.forEach(video => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <img class="thumb" src="${ytThumb(video.id)}">
            <div class="info">
                <div class="titleText">${video.title}</div>
                <div class="desc">${video.desc}</div>
            </div>
        `;

        card.onclick = () => play(video);
        grid.appendChild(card);
    });
}

function applyFilters(){

    const q = search.value.toLowerCase();

    const filtered = videos.filter(v => {

        const matchText =
            v.title.toLowerCase().includes(q) ||
            v.desc.toLowerCase().includes(q);

        const matchCat =
            currentCategory === "all" ||
            (Array.isArray(v.cat) && v.cat.includes(currentCategory));

        return matchText && matchCat;
    });

    render(filtered);
}

search.addEventListener("input", applyFilters);

document.querySelectorAll(".cat").forEach(btn => {
    btn.addEventListener("click", () => {
        currentCategory = btn.dataset.cat;
        applyFilters();
    });
});

render(videos);
if(videos.length > 0) play(videos[0]);

});
</script>

</body>
</html>
