<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HawkTV</title>

<style>
body{
    margin:0;
    background:#000;
    color:#ff2a2a;
    font-family:Arial, sans-serif;
}

.page{
    max-width:1000px;
    margin:0 auto;
    padding:10px 12px 25px;
}

/* HEADER */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid #330000;
}

.title{
    font-size:20px;
    font-weight:bold;
}

/* SEARCH */
#search{
    width:200px;
    padding:6px;
    background:#000;
    color:#ff2a2a;
    border:1px solid #aa0000;
}

/* PLAYER */
#playerBox{
    width:100%;
    height:420px;
    margin-top:12px;
    border:2px solid #aa0000;
    border-radius:6px;
    overflow:hidden;
    background:black;
}

iframe{
    width:100%;
    height:100%;
    border:0;
}

/* CATEGORY BAR */
.categories{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:12px;
}

.cat{
    padding:6px 10px;
    border:1px solid #aa0000;
    cursor:pointer;
    font-size:12px;
    background:#111;
    transition:0.2s;
}

.cat:hover{
    background:#220000;
}

/* GRID (BIGGER CARDS) */
.grid{
    margin-top:15px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
    gap:12px;
}

.card{
    background:#111;
    border:1px solid #220000;
    border-radius:6px;
    overflow:hidden;
    cursor:pointer;
    transition:0.2s;
}

.card:hover{
    transform:scale(1.05);
    border-color:#ff2a2a;
}

.thumb{
    width:100%;
    height:120px; /* BIGGER ICON */
    object-fit:cover;
}

.info{
    padding:8px;
}

.titleText{
    font-size:13px;
    font-weight:bold;
}

.desc{
    font-size:11px;
    color:#cc6666;
    margin-top:2px;
}
</style>
</head>

<body>

<div class="page">

<div class="header">
    <div class="title">HawkTV</div>
    <input id="search" placeholder="search...">
</div>

<!-- PLAYER -->
<div id="playerBox">Select a video</div>

<!-- CATEGORIES -->
<div class="categories">
    <div class="cat" data-cat="all">All</div>
    <div class="cat" data-cat="Documentary">Documentary</div>
    <div class="cat" data-cat="Educational">Educational</div>
    <div class="cat" data-cat="Movies & Films">Movies & Films</div>
    <div class="cat" data-cat="Gaming">Gaming</div>
    <div class="cat" data-cat="Challenge">Challenge</div>
    <div class="cat" data-cat="Minecraft">Minecraft</div>
    <div class="cat" data-cat="News">News</div>
    <div class="cat" data-cat="Cartoon">Cartoon</div>
</div>

<!-- GRID -->
<div class="grid" id="grid"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const videos = [
{
    title:"Nature Documentary",
    desc:"Wildlife scenes",
    id:"lm5WwjCAsk4",
    cat:"Documentary"
},
{
    title:"Math Basics",
    desc:"Educational video",
    id:"IAJHDiO8Fr0",
    cat:"Educational"
},
{
    title:"Minecraft Build",
    desc:"Epic house build",
    id:"lm5WwjCAsk4",
    cat:"Minecraft"
},
{
    title:"Funny Cartoon Clip",
    desc:"Classic animation",
    id:"IAJHDiO8Fr0",
    cat:"Cartoon"
}
];

const playerBox = document.getElementById("playerBox");
const grid = document.getElementById("grid");
const search = document.getElementById("search");

let currentCategory = "all";

function ytEmbed(id){
    return `https://www.youtube.com/embed/${id}`;
}

function ytThumb(id){
    return `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
}

// PLAYER
function play(v){
    playerBox.innerHTML = `
        <iframe
            src="${ytEmbed(v.id)}"
            allowfullscreen
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        ></iframe>
    `;
}

// GRID
function render(list){
    grid.innerHTML = "";

    list.forEach(v => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <img class="thumb" src="${ytThumb(v.id)}">
            <div class="info">
                <div class="titleText">${v.title}</div>
                <div class="desc">${v.desc}</div>
            </div>
        `;

        card.onclick = () => play(v);
        grid.appendChild(card);
    });
}

// FILTER SYSTEM
function applyFilters(){
    const q = search.value.toLowerCase();

    const filtered = videos.filter(v => {
        const matchText =
            v.title.toLowerCase().includes(q) ||
            v.desc.toLowerCase().includes(q);

        const matchCat =
            currentCategory === "all" || v.cat === currentCategory;

        return matchText && matchCat;
    });

    render(filtered);
}

// SEARCH
search.addEventListener("input", applyFilters);

// CATEGORY CLICK
document.querySelectorAll(".cat").forEach(btn => {
    btn.addEventListener("click", () => {
        currentCategory = btn.dataset.cat;
        applyFilters();
    });
});

// INIT
render(videos);
play(videos[0]);

});
</script>

</body>
</html>
