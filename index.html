<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HawkTV</title>

<style>
body{
    margin:0;
    background:#000;
    color:#ff2a2a;
    font-family:Arial, sans-serif;
}

.page{
    max-width:1000px;
    margin:0 auto;
    padding:10px 12px 25px;
}

.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0;
    border-bottom:1px solid #330000;
}

.title{
    font-size:20px;
    font-weight:bold;
}

#search{
    width:200px;
    padding:6px;
    background:#000;
    color:#ff2a2a;
    border:1px solid #aa0000;
}

/* PLAYER */
#playerBox{
    width:100%;
    height:420px;
    margin-top:12px;
    border:2px solid #aa0000;
    border-radius:6px;
    overflow:hidden;
    background:black;
}

iframe{
    width:100%;
    height:100%;
    border:0;
}

/* HOME GRID */
.categoryHome{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(170px, 1fr));
    gap:12px;
    margin-top:12px;
}

/* CATEGORY CARD */
.catCard{
    position:relative;
    height:100px;
    border:1px solid #aa0000;
    border-radius:8px;
    overflow:hidden;
    cursor:pointer;
    transition:0.2s;
}

.catCard:hover{
    transform:scale(1.05);
    border-color:#ff2a2a;
}

.catCard img{
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0.7;
}

.catCard span{
    position:absolute;
    bottom:8px;
    left:10px;
    color:white;
    font-weight:bold;
    text-shadow:0 0 5px black;
}

/* VIDEO GRID */
.grid{
    margin-top:15px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(200px, 1fr));
    gap:12px;
}

.card{
    background:#111;
    border:1px solid #220000;
    border-radius:6px;
    overflow:hidden;
    cursor:pointer;
    transition:0.2s;
}

.card:hover{
    transform:scale(1.05);
    border-color:#ff2a2a;
}

.thumb{
    width:100%;
    height:120px;
    object-fit:cover;
}

.info{
    padding:8px;
}

.titleText{
    font-size:13px;
    font-weight:bold;
}

.desc{
    font-size:11px;
    color:#cc6666;
}

/* BACK BUTTON */
.backBtn{
    display:none;
    margin-top:10px;
    padding:6px 10px;
    border:1px solid #aa0000;
    width:fit-content;
    cursor:pointer;
    background:#111;
    border-radius:6px;
}
</style>
</head>

<body>

<div class="page">

<div class="header">
    <div class="title">HawkTV</div>
    <input id="search" placeholder="search...">
</div>

<div id="playerBox">Select a video</div>

<!-- HOME + BACK -->
<div id="categoryHome" class="categoryHome"></div>
<div id="backBtn" class="backBtn">← Back</div>

<div class="grid" id="grid"></div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {

const playerBox = document.getElementById("playerBox");
const grid = document.getElementById("grid");
const search = document.getElementById("search");
const categoryHome = document.getElementById("categoryHome");
const backBtn = document.getElementById("backBtn");

let currentCategory = "all";

/* =========================================================
   🎬 YOUR VIDEOS (UNCHANGED — FULL PRESERVED)
========================================================= */

const videos = [
{
    title:"The best of Simpsons season 11",
    desc:"The funniest moments in the Simpsons",
    id:"lm5WwjCAsk4",
    cat:["Cartoon","Movies and Films","Sitcom","Simpsons"]
},
{
    title:"Simpsons - Talkin' Softball",
    desc:"Simpsons ending theme",
    id:"IAJHDiO8Fr0",
    cat:["Cartoon","Movies and Films","Sitcom","Simpsons"]
},
{
    title:"Mumin1969:The Secret of the Silk Hat",
    desc:"S1E1",
    id:"R3l77LjCkOc",
    cat:["Cartoon","Mumin(1969)","Movies and Films","Anime"]
},
{
    title:"Mumin1969:Aim for the Devil's Heart",
    desc:"S1E2",
    id:"MXGIj8lalJY",
    cat:["Cartoon","Mumin(1969)","Movies and Films","Anime"]
},
{
    title:"Mumin1969:Rain! Storm!! Flood!!!",
    desc:"S1E3",
    id:"Hs3tZFIXE8s",
    cat:["Cartoon","Mumin(1969)","Movies and Films","Anime"]
},
{
    title:"Where is the Wonderful Spring?",
    desc:"S1E4",
    id:"wzrs89lYRIE",
    cat:["Cartoon","Mumin(1969)","Movies and Films","Anime"]
},
{
    title:"Papa's Remembered Rifle",
    desc:"S1E5",
    id:"zffrH3s6F1U",
    cat:["Cartoon","Mumin(1969)","Movies and Films","Anime"]
},
{
    title:"Nonnon Who Comes Back",
    desc:"S1E6",
    id:"3dvQuytCcb0",
    cat:["Cartoon","Mumin(1969)","Movies and Films","Anime"]
},
{
    title:"The ENTIRE Story of The Simpson in 90 Minutes",
    desc:"Simpsons recap",
    id:"gf2FmRM1p0E",
    cat:["Cartoon","Movies and Films","Documentary","JarToon","Simpsons","Sitcom"]
},
{
    title:"The ENTIRE Story Of Futurama in 77 Minutes",
    desc:"Futurama recap",
    id:"gaeKUAiRToo",
    cat:["Cartoon","Movies and Films","Documentary","JarToon","Sitcom"]
},
{
    title:"The Entire Story of Family Guy In 62 Minutes",
    desc:"Family Guy recap",
    id:"odtQ9ZMLxGY",
    cat:["Cartoon","Movies and Films","Documentary","JarToon","Sitcom"]
},
{
    title:"Sickick - Epic Post Malone Mashup (Live)",
    desc:"Music",
    id:"9DIqnFqYeTE",
    cat:["Music","SickickMusic"]
},
{
    title:"Sickick - Mind Games (Robbe Remix)",
    desc:"Music remix",
    id:"gidSH8sw6I0",
    cat:["Music","SickickMusic"]
}
];

/* =========================================================
   🌍 CATEGORIES WITH IMAGES (YOU EDIT THESE)
========================================================= */

const categories = [
    { name:"Cartoon", img:"https://i.imgur.com/8QfQKQp.jpg" },
    { name:"Movies and Films", img:"https://i.imgur.com/3ZQZQZQ.jpg" },
    { name:"Music", img:"https://i.imgur.com/9x9x9x9.jpg" },
    { name:"Simpsons", img:"https://i.imgur.com/1a1a1a1.jpg" },
    { name:"FamilyGuy", img:"https://i.imgur.com/2b2b2b2.jpg" }
];

/* =========================================================
   VIDEO ENGINE (YouTube + Internet Archive)
========================================================= */

function getVideoSrc(video){

    // Internet Archive or MP4
    if(video.type === "archive"){
        return video.id;
    }

    return `https://www.youtube-nocookie.com/embed/${video.id}`;
}

function play(video){
    playerBox.innerHTML = `
        <iframe src="${getVideoSrc(video)}"
        allowfullscreen></iframe>
    `;
}

function ytThumb(id){
    return `https://img.youtube.com/vi/${id}/hqdefault.jpg`;
}

/* =========================================================
   GRID
========================================================= */

function render(list){
    grid.innerHTML = "";

    list.forEach(video => {

        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <img class="thumb" src="${ytThumb(video.id)}">
            <div class="info">
                <div class="titleText">${video.title}</div>
                <div class="desc">${video.desc}</div>
            </div>
        `;

        card.onclick = () => play(video);
        grid.appendChild(card);
    });
}

/* =========================================================
   FILTER
========================================================= */

function applyFilters(){

    const q = search.value.toLowerCase();

    const filtered = videos.filter(v => {

        const matchText =
            v.title.toLowerCase().includes(q) ||
            v.desc.toLowerCase().includes(q);

        const matchCat =
            currentCategory === "all" ||
            v.cat.includes(currentCategory);

        return matchText && matchCat;
    });

    render(filtered);
}

/* =========================================================
   HOME SCREEN
========================================================= */

function renderHome(){

    categoryHome.style.display = "grid";
    grid.style.display = "none";
    backBtn.style.display = "none";

    categoryHome.innerHTML = "";

    categories.forEach(cat => {

        const div = document.createElement("div");
        div.className = "catCard";

        div.innerHTML = `
            <img src="${cat.img}">
            <span>${cat.name}</span>
        `;

        div.onclick = () => openCategory(cat.name);

        categoryHome.appendChild(div);
    });
}

function openCategory(name){

    currentCategory = name;

    categoryHome.style.display = "none";
    grid.style.display = "grid";
    backBtn.style.display = "block";

    applyFilters();
}

backBtn.onclick = () => renderHome();

search.addEventListener("input", applyFilters);

/* INIT */
renderHome();

});
</script>

</body>
</html>
